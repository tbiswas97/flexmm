[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexmm"
version = "0.1.0"
description = "Flexible mixture-model segmentation and posterior analysis for images"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Tridib Biswas"}]
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "ruff>=0.8", "twine>=5.1"]

[tool.setuptools.packages.find]
include = ["flexmm*", "dinov3*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "flexmm/seg",
  "flexmm/toolbox.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"dinov3/**" = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["flexmm"]
